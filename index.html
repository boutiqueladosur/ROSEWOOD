<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="Rosewood | Colección exclusiva de carteras, calzado y accesorios boutique. Haz tu pedido directamente por WhatsApp.">
  <title>Rosewood | Boutique Online & Atelier</title>
  
  <!-- Tipografías de Alta Gama desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #fcfbfa;
      --bg-surface: #ffffff;
      --bg-subtle: #f5f2ed;
      --text-main: #181716;
      --text-muted: #726d66;
      --text-light: #9e978e;
      --accent-gold: #b38e5d;
      --accent-gold-dark: #8c6c40;
      --accent-gold-light: #f7f3ec;
      --border-color: #e8e3dc;
      --border-focus: #181716;
      --danger: #b83b32;
      --success: #217a4b;
      --shadow-sm: 0 2px 8px rgba(24, 23, 22, 0.04);
      --shadow-md: 0 12px 32px rgba(24, 23, 22, 0.08);
      --shadow-lg: 0 24px 48px rgba(24, 23, 22, 0.12);
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 16px;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: "Plus Jakarta Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .announcement {
      background: var(--text-main);
      color: var(--bg-main);
      text-align: center;
      padding: 10px 16px;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(252, 251, 250, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      transition: var(--transition);
    }
    .nav {
      max-width: 1320px;
      margin: 0 auto;
      height: 80px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-logo-mark {
      width: 42px;
      height: 42px;
      border: 1px solid var(--accent-gold);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--accent-gold);
      font-family: "Cinzel", serif;
      font-size: 20px;
      font-weight: 600;
    }
    .brand-title {
      font-family: "Cinzel", serif;
      font-size: 22px;
      letter-spacing: 0.15em;
      font-weight: 600;
      line-height: 1;
    }
    .brand-sub {
      display: block;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .nav-links {
      display: flex;
      gap: 36px;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    }
    .nav-links a {
      color: var(--text-muted);
      transition: var(--transition);
      position: relative;
    }
    .nav-links a:hover { color: var(--text-main); }
    
    .cart-btn-trigger {
      background: var(--text-main);
      color: var(--bg-surface);
      border: 1px solid var(--text-main);
      border-radius: 40px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: var(--transition);
    }
    .cart-btn-trigger:hover {
      background: var(--accent-gold-dark);
      border-color: var(--accent-gold-dark);
      transform: translateY(-1px);
    }
    .cart-badge {
      background: var(--accent-gold);
      color: var(--bg-surface);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 700;
    }
    .hero {
      max-width: 1320px;
      margin: 0 auto;
      padding: 72px 32px 48px;
      text-align: center;
    }
    .eyebrow-tag {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-gold);
      font-weight: 700;
      margin-bottom: 20px;
    }
    .eyebrow-tag::before, .eyebrow-tag::after {
      content: "";
      width: 32px;
      height: 1px;
      background: var(--accent-gold);
    }
    .hero-title {
      font-family: "Playfair Display", serif;
      font-size: clamp(40px, 5.5vw, 68px);
      font-weight: 400;
      line-height: 1.1;
      color: var(--text-main);
      margin: 0 0 20px;
    }
    .hero-title em {
      font-style: italic;
      color: var(--accent-gold-dark);
    }
    .hero-subtitle {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto 36px;
      font-weight: 400;
    }
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: var(--accent-gold);
      color: var(--bg-surface);
      padding: 16px 36px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition);
      box-shadow: 0 8px 20px rgba(179, 142, 93, 0.25);
    }
    .hero-cta:hover {
      background: var(--accent-gold-dark);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(179, 142, 93, 0.35);
    }
    .benefits-strip {
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-subtle);
    }
    .benefits-grid {
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px 32px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
    }
    .benefit-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .benefit-item i {
      font-size: 18px;
      color: var(--accent-gold);
    }
    .catalog {
      max-width: 1320px;
      margin: 0 auto;
      padding: 80px 32px 120px;
    }
    .catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 36px;
      gap: 20px;
    }
    .catalog-header h2 {
      font-family: "Playfair Display", serif;
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 500;
      margin: 8px 0 0;
    }
    .catalog-header p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }
    .toolbar-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 28px;
    }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 420px;
    }
    .search-box i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 14px;
    }
    .search-box input {
      width: 100%;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      padding: 14px 18px 14px 46px;
      outline: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      transition: var(--transition);
    }
    .search-box input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(24, 23, 22, 0.05);
    }
    .sort-dropdown {
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      padding: 14px 40px 14px 18px;
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%20181716' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 14px;
    }
    .categories-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .category-chip {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      border-radius: 40px;
      padding: 10px 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    .category-chip:hover, .category-chip.active {
      background: var(--text-main);
      color: var(--bg-surface);
      border-color: var(--text-main);
    }
    .meta-status {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px 28px;
    }
    .product-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
      border-color: rgba(24, 23, 22, 0.15);
    }
    .card-media {
      position: relative;
      background: var(--bg-subtle);
      aspect-ratio: 3/4;
      overflow: hidden;
    }
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .product-card:hover .card-media img {
      transform: scale(1.05);
    }
    .card-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 2;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      color: var(--text-main);
      padding: 6px 12px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: var(--radius-sm);
    }
    .discount-tag {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      background: var(--danger);
      color: white;
      padding: 6px 10px;
      font-size: 10px;
      font-weight: 700;
      border-radius: var(--radius-sm);
    }
    .thumb-gallery {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      overflow-x: auto;
    }
    .thumb-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 0;
      overflow: hidden;
      background: var(--bg-subtle);
      opacity: 0.5;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-btn.active, .thumb-btn:hover {
      opacity: 1;
      border-color: var(--accent-gold);
    }
    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      text-align: center;
    }
    .card-title {
      font-family: "Playfair Display", serif;
      font-size: 18px;
      font-weight: 500;
      margin: 0 0 10px;
      color: var(--text-main);
    }
    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0 0 16px;
      min-height: 38px;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }
    .price-box {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
    }
    .price-old {
      font-size: 13px;
      color: var(--text-light);
      text-decoration: line-through;
    }
    .price-current {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }
    .add-to-cart-btn {
      width: 100%;
      background: var(--text-main);
      color: var(--bg-surface);
      border: none;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
    }
    .add-to-cart-btn:hover {
      background:
